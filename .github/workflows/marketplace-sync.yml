name: Sync to marketplace

# After a change lands on main, copy the plugin into the inlined copy at
# cyface/cyface-claude-plugin-marketplace/plugins/alpine-htmx and open (or
# update) a PR there.
#
# Needs secret MARKETPLACE_TOKEN: a fine-grained PAT (or GitHub App token)
# with Contents and Pull requests read/write on cyface-claude-plugin-marketplace.
# GITHUB_TOKEN can't write to another repository.

on:
  push:
    branches: [main]
    # Repo-only files that the marketplace copy leaves out
    paths-ignore:
      - ".github/**"
      - "evals/**"
      - "versions.json"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: marketplace-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEST: plugins/alpine-htmx
    steps:
      - name: Check for MARKETPLACE_TOKEN
        env:
          TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
        run: |
          if [[ -z "$TOKEN" ]]; then
            echo "::error::Secret MARKETPLACE_TOKEN is not set; see the comment at the top of marketplace-sync.yml."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          path: plugin

      - uses: actions/checkout@v6
        with:
          repository: cyface/cyface-claude-plugin-marketplace
          token: ${{ secrets.MARKETPLACE_TOKEN }}
          path: marketplace

      - name: Copy the plugin into the marketplace
        id: copy
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "marketplace/$DEST"
          mkdir -p "marketplace/$DEST"
          # Tracked files only, minus the repo-only ones listed in paths-ignore
          git -C plugin ls-files -z \
            | grep -zvE '^(\.github/|evals/|\.gitignore$|versions\.json$)' \
            | tar -C plugin --null -T - -cf - \
            | tar -C "marketplace/$DEST" -xf -
          echo "version=$(jq -r .version plugin/.claude-plugin/plugin.json)" >> "$GITHUB_OUTPUT"
          git -C marketplace status --short

      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate the marketplace and the plugin copy
        working-directory: marketplace
        run: |
          npx -y @anthropic-ai/claude-code plugin validate .
          npx -y @anthropic-ai/claude-code plugin validate --strict "$DEST"

      - name: Open or update the marketplace pull request
        uses: peter-evans/create-pull-request@v8
        with:
          path: marketplace
          token: ${{ secrets.MARKETPLACE_TOKEN }}
          branch: sync/alpine-htmx
          delete-branch: true
          add-paths: plugins/alpine-htmx/**
          commit-message: "Update alpine-htmx to ${{ steps.copy.outputs.version }}"
          title: "Update alpine-htmx to ${{ steps.copy.outputs.version }}"
          body: |
            Syncs `plugins/alpine-htmx` from ${{ github.repository }}@${{ github.sha }}.

            Changes since the last sync: see the plugin's [CHANGELOG](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/CHANGELOG.md) and [commits](${{ github.server_url }}/${{ github.repository }}/commits/main).

            Opened by the [Sync to marketplace](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) workflow. Repo-only files (`.github/`, `evals/`, `versions.json`, `.gitignore`) are left out.
