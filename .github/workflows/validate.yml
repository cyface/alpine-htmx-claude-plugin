name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:
  # Bot PRs opened with GITHUB_TOKEN don't trigger pull_request, so the
  # framework-versions workflow dispatches this on its branch instead.
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate plugin (structure, version pins, SRI hashes)
        run: .github/scripts/validate.sh
